<style>
:root {
  --navy:    #003764;
  --navy-d:  #002548;
  --navy-l:  #0a4a7c;
  --orange:  #FF6921;
  --orange-d:#e05510;
  --teal:    #2CD5C4;
  --teal-d:  #1aada0;
  --white:   #ffffff;
  --off-white: #f7f6f3;
  --light:   #eef1f5;
  --ink:     #0d1f33;
  --muted:   #5a6b7d;
  --rule:    rgba(0,55,100,.1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--white);
  color: var(--ink);
  overflow-x: hidden;
}


/* NAV */
nav {
  background: var(--navy);
  display: flex;
  align-items: center;
  padding: 0 40px;
  height: 58px;
  gap: 32px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--white);
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
}
.nav-mark { height: 40px; width: auto; display: block; flex-shrink: 0; object-fit: contain; opacity: 1; transition: opacity .3s ease; }
.nav-links {
  display: flex;
  gap: 2px;
  margin-left: auto;
  align-items: center;
}
.nav-link {
  color: rgba(255,255,255,.6);
  font-size: 13px;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
  transition: color .15s, background .15s;
  text-decoration: none;
}
.nav-link:hover { color: var(--white); background: rgba(255,255,255,.08); }
.nav-link.active { color: var(--white); }

/* PAGE HEADER */
.page-header {
  background: var(--navy);
  padding: 52px 60px 44px;
  border-bottom: 3px solid var(--orange);
  position: relative;
  overflow: hidden;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
}
.bc-link {
  font-size: 12px;
  color: rgba(255,255,255,.4);
  cursor: pointer;
  transition: color .15s;
  text-decoration: none;
}
.bc-link:hover { color: rgba(255,255,255,.7); }
.bc-sep {
  font-size: 11px;
  color: rgba(255,255,255,.2);
}
.bc-current {
  font-size: 12px;
  color: var(--teal);
  font-weight: 500;
}
.page-title-label {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--teal);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .15em;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.label-bar { width: 24px; height: 2px; background: var(--teal); }
.page-h1 {
  font-family: 'Oswald', sans-serif;
  font-size: 52px;
  font-weight: 700;
  color: var(--white);
  line-height: 1;
  margin-bottom: 12px;
}
.page-sub {
  font-size: 14px;
  color: rgba(255,255,255,.45);
  line-height: 1.8;
  max-width: 500px;
  word-break: keep-all;
}

/* FEATURED SECTION */
.featured-section {
  padding: 64px 40px 48px;
  background: var(--white);
}
.sec-label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}
.sec-label-text {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.sec-label-line {
  flex: 1;
  height: 1px;
  background: var(--rule);
}

.featured-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  grid-template-rows: auto auto;
  gap: 14px;
}

/* Featured cards */
.feat-card {
  border: 1px solid var(--rule);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s, border-color .2s;
  background: var(--white);
}
.feat-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 36px rgba(0,55,100,.1);
  border-color: rgba(0,55,100,.2);
}
.feat-card.main-card {
  grid-row: 1 / 3;
  background: var(--navy);
  border-color: var(--navy);
}

/* Video embed area */
.video-wrap {
  position: relative;
  padding-bottom: 56.25%;
  background: #000;
  overflow: hidden;
}
.video-wrap iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

.feat-body {
  padding: 24px 26px 26px;
}
.feat-card.main-card .feat-body { padding: 28px 28px 28px; }

.media-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.badge-intl  { background: rgba(255,105,33,.12); color: var(--orange-d); }
.badge-video { background: rgba(44,213,196,.12); color: var(--teal-d); }
.badge-text  { background: rgba(0,55,100,.08); color: var(--navy); }
.feat-card.main-card .badge-intl  { background: rgba(255,105,33,.2); color: var(--orange); }
.feat-card.main-card .badge-video { background: rgba(44,213,196,.15); color: var(--teal); }

.feat-outlet {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--teal-d);
  margin-bottom: 6px;
}
.feat-card.main-card .feat-outlet { color: var(--teal); }

.feat-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.45;
  margin-bottom: 10px;
}
.feat-card.main-card .feat-title { color: var(--white); font-size: 17px; }

.feat-desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.75;
  margin-bottom: 14px;
}
.feat-card.main-card .feat-desc { color: rgba(255,255,255,.45); }

.feat-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.feat-date {
  font-size: 11px;
  color: var(--muted);
}
.feat-card.main-card .feat-date { color: rgba(255,255,255,.3); }
.feat-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  color: var(--orange);
  cursor: pointer;
  transition: gap .2s;
  text-decoration: none;
}
.feat-link:hover { gap: 9px; }

/* DIVIDER */
.section-divider {
  margin: 0 40px;
  height: 1px;
  background: var(--rule);
}

/* ALL REPORTS SECTION */
.all-section {
  padding: 56px 40px 80px;
  background: var(--off-white);
}

.tl-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 40px;
}
.tl-title {
  font-family: 'Oswald', sans-serif;
  font-size: 32px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1;
}
.tl-title small {
  display: block;
  font-size: 11px;
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.tl-count {
  font-size: 12px;
  color: var(--muted);
}

/* Year group — collapsible */
.year-group {
  margin-bottom: 36px;
}
.year-label {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 0;
  cursor: pointer;
  padding: 10px 0;
  user-select: none;
  -webkit-user-select: none;
}
.year-label:hover .year-num { color: var(--navy-l); }
.year-num {
  font-family: 'Oswald', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--navy);
  letter-spacing: .06em;
  white-space: nowrap;
  transition: color .15s;
}
.year-count {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
.year-arrow {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  color: var(--muted);
  transition: transform .25s;
}
.year-group.open .year-arrow { transform: rotate(180deg); }
.year-line {
  flex: 1;
  height: 1px;
  background: var(--rule);
}
.year-content {
  overflow: hidden;
  max-height: 0;
  transition: max-height .35s ease;
}
.year-group.open .year-content {
  max-height: 5000px;
  transition: max-height .5s ease;
}
.year-group.open .year-label {
  margin-bottom: 16px;
}

/* Row items */
.report-row {
  display: grid;
  grid-template-columns: 88px 130px 1fr auto;
  gap: 0 20px;
  align-items: start;
  padding: 16px 20px 16px 16px;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  transition: background .15s;
  border-radius: 4px;
  position: relative;
}
.report-row:hover { background: rgba(0,55,100,.03); }
.report-row:last-child { border-bottom: none; }

.row-accent {
  width: 3px;
  position: absolute;
  left: 0; top: 0; bottom: 0;
  border-radius: 4px 0 0 4px;
}
.accent-orange { background: var(--orange); }
.accent-teal   { background: var(--teal); }
.accent-navy   { background: var(--navy-l); }

.row-date {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .04em;
  padding-top: 3px;
}
.row-outlet {
  font-size: 12px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 2px;
  letter-spacing: .02em;
}
.row-country {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .05em;
}
.row-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.4;
  margin-bottom: 4px;
}
.row-excerpt {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.65;
}
.row-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  padding-top: 2px;
}
.type-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 99px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .05em;
  white-space: nowrap;
}
.pill-video { background: rgba(44,213,196,.12); color: var(--teal-d); }
.pill-text  { background: rgba(0,55,100,.08); color: var(--navy); }
.row-link {
  font-size: 11px;
  font-weight: 700;
  color: var(--orange);
  text-decoration: none;
  transition: opacity .15s;
  white-space: nowrap;
}
.row-link:hover { opacity: .7; }

/* ── 手機漢堡選單 ── */
.nav-hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  margin-left: auto;
  width: 36px;
  height: 36px;
  padding: 6px;
  border-radius: 4px;
  cursor: pointer;
  background: none;
  border: none;
  flex-shrink: 0;
  transition: background .15s;
}
.nav-hamburger:hover { background: rgba(255,255,255,.08); }
.nav-hamburger span {
  display: block;
  height: 2px;
  background: rgba(255,255,255,.7);
  border-radius: 2px;
  transition: transform .25s, opacity .25s;
  transform-origin: center;
}
.nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-hamburger.open span:nth-child(2) { opacity: 0; }
.nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.nav-drawer { display: none; flex-direction: column; background: var(--navy); padding: 8px 0; position: fixed; top: 56px; left: 0; right: 0; z-index: 99; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.nav-drawer.open { display: flex; }
.nav-drawer .nav-link { padding: 12px 24px; border-radius: 0; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,.06); }
.nav-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 98; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.nav-backdrop.open { display: block; }

/* ── FOOTER CTA ── */
.footer-cta {
  background: var(--orange);
  padding: 56px 40px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
}
.fcta-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(255,255,255,.65);
  margin-bottom: 10px;
}
.fcta-title {
  font-family: 'Oswald', sans-serif;
  font-size: 36px;
  font-weight: 600;
  color: var(--white);
  line-height: 1.1;
}
.fcta-btns { display: flex; gap: 12px; flex-shrink: 0; }
.fcta-btn-w {
  background: var(--white);
  color: var(--orange);
  font-size: 14px;
  font-weight: 700;
  padding: 13px 26px;
  border-radius: 4px;
  border: none;
  cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif;
  transition: background .15s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}
.fcta-btn-w:hover { background: var(--off-white); }
.fcta-btn-o {
  background: transparent;
  color: rgba(255,255,255,.8);
  font-size: 14px;
  font-weight: 500;
  padding: 13px 22px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,.4);
  cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif;
  transition: border-color .15s, color .15s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}
.fcta-btn-o:hover { border-color: rgba(255,255,255,.8); color: var(--white); }

/* ── FOOTER ── */
footer {
  background: var(--navy-d);
  padding: 28px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.footer-brand { color: rgba(255,255,255,.5); font-size: 12px; }
.footer-brand-en { color: rgba(255,255,255,.35); font-size: 11px; margin-top: 2px; }
.footer-reg { color: rgba(255,255,255,.25); font-size: 11px; letter-spacing: .04em; margin-top: 4px; }
.footer-social { display: flex; gap: 10px; }
.social-btn { width: 30px; height: 30px; border-radius: 4px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.5); text-decoration: none; transition: background .15s; }
.social-btn:hover { background: rgba(255,255,255,.16); color: var(--white); }

/* ── ANIMATIONS ── */
.fade-in { opacity: 0; transform: translateY(12px); transition: opacity .45s, transform .45s; }
.fade-in.show { opacity: 1; transform: none; }

/* ── RWD ── */
@media (max-width: 768px) {
  .featured-grid {
    grid-template-columns: 1fr;
    grid-template-rows: auto;
  }
  .feat-card.main-card { grid-row: auto; }
  nav { padding: 0 20px; gap: 16px; }
  .nav-links { display: none; }
  .nav-hamburger { display: flex; }
  .featured-section, .all-section { padding-left: 24px; padding-right: 24px; }
  .page-header { padding: 40px 20px 36px; }
  .section-divider { margin: 0 24px; }
  footer { padding: 24px 20px; flex-direction: column; align-items: flex-start; gap: 12px; }
  .report-row { grid-template-columns: 72px 110px 1fr auto; gap: 0 14px; }
  .footer-cta { flex-direction: column; align-items: flex-start; padding: 40px 20px; gap: 24px; }
  .fcta-title { font-size: 26px; }
  .fcta-btns { flex-direction: column; width: 100%; }
  .fcta-btn-w, .fcta-btn-o { width: 100%; justify-content: center; text-align: center; }
}

@media (max-width: 540px) {
  .report-row {
    display: block;
    padding: 14px 16px 14px 16px;
  }
  .row-date {
    display: inline;
    margin-right: 8px;
    font-size: 10px;
  }
  .row-outlet-wrap {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .row-country { display: none; }
  .row-title { font-size: 13px; margin-bottom: 4px; }
  .row-excerpt { display: none; }
  .row-right {
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    margin-top: 10px;
    gap: 10px;
  }
  .page-h1 { font-size: 34px; }
  .tl-head { flex-direction: column; align-items: flex-start; gap: 4px; }
  .tl-title { font-size: 24px; }
  .all-section { padding-left: 16px; padding-right: 16px; }
  .featured-section { padding-left: 16px; padding-right: 16px; }
}
</style>

</head>

    <div class="footer-brand-en">Taichung City Citizen Corps Association</div>
    <div class="footer-reg">中市社團字第1130158795號 ｜ 113 法登 證社字第000117號</div>
  </div>
  <div class="footer-social">
    <a class="social-btn" data-href="url_facebook" href="#" target="_blank">f</a>
    <a class="social-btn" data-href="url_threads" href="#" target="_blank">T</a>
    <a class="social-btn" data-href="url_plurk" href="#" target="_blank">p</a>
  </div>
</footer>

<script>
/* ══════════════════════════════════════════
   CSV 基礎工具 + localStorage 快取
══════════════════════════════════════════ */
var CSV_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmLYivM4AX0l0D6Qv8i39uy_IQe4UkAgAm2wO5ACdo5dNxyH_TURO9LCipQRid3GfEKcI9OmAcZC0g/pub?gid=GID&single=true&output=csv';
function csvUrl(gid) { return CSV_BASE.replace('GID', gid); }

/* ── LocalStorage 快取 (6 小時) ── */
var CACHE_TTL = 6 * 60 * 60 * 1000;
var NOCACHE = new URLSearchParams(window.location.search).has('nocache');

function getCacheKey(sheetName) { return 'txgcca_cache_' + sheetName; }

function getCache(sheetName) {
  if (NOCACHE) return null;
  try {
    var raw = localStorage.getItem(getCacheKey(sheetName));
    if (!raw) return null;
    var cached = JSON.parse(raw);
    var age = Date.now() - cached.timestamp;
    if (age < CACHE_TTL) {
      console.log('[TXGCCA] Cache mode: ENABLED (age: ' + Math.round(age / 60000) + ' minutes) — ' + sheetName);
      return cached.data;
    }
  } catch (e) { /* ignore corrupt cache */ }
  return null;
}

function setCache(sheetName, data) {
  try {
    localStorage.setItem(getCacheKey(sheetName), JSON.stringify({ timestamp: Date.now(), data: data }));
  } catch (e) { /* localStorage full or unavailable */ }
}

function fetchCSV(gid, sheetName) {
  var cached = getCache(sheetName);
  if (cached) return Promise.resolve(cached);

  if (NOCACHE) {
    console.log('[TXGCCA] Cache mode: BYPASSED (?nocache=1 detected) — ' + sheetName);
  } else {
    console.log('[TXGCCA] Cache mode: INITIAL FETCH — ' + sheetName);
  }

  return fetch(csvUrl(gid))
    .then(function(r) { return r.text(); })
    .then(function(text) {
      setCache(sheetName, text);
      return text;
    });
}

/* ── CSV 解析工具 ── */
function parseCSV(text) {
  var rows = [];
  var row = [], cur = '', inQ = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i], next = text[i+1];
    if (inQ) {
      if (ch === '"' && next === '"') { cur += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else { cur += ch; }
    } else {
      if (ch === '"') { inQ = true; }
      else if (ch === ',') { row.push(cur.trim()); cur = ''; }
      else if (ch === '\r' && next === '\n') { row.push(cur.trim()); cur = ''; rows.push(row); row = []; i++; }
      else if (ch === '\n') { row.push(cur.trim()); cur = ''; rows.push(row); row = []; }
      else { cur += ch; }
    }
  }
  if (cur || row.length) { row.push(cur.trim()); rows.push(row); }
  return rows.filter(function(r) { return r.some(function(c) { return c; }); });
}

function parseKV(rows) {
  var obj = {};
  rows.forEach(function(row) {
    if (row[0] && row[2] && row[0] !== '欄位名稱') obj[row[0]] = row[2];
  });
  return obj;
}

function parseRows(rows) {
  var headers = rows[0];
  return rows.slice(1)
    .filter(function(row) { return row[0] && /^[a-z]+-\d+/.test(row[0]); })
    .map(function(row) {
      var obj = {};
      headers.forEach(function(h, i) { if (h) obj[h] = row[i] || ''; });
      return obj;
    });
}

/* ── 全站設定套用 ── */
function applyFields(data) {
  /* data-field 文字替換 */
  document.querySelectorAll('[data-field]').forEach(function(el) {
    var key = el.dataset.field;
    if (data[key]) {
      if (el.tagName === 'IMG') {
        if (key === 'url_logo') {
          el.style.opacity = '0';
          el.onload = function(){ this.style.opacity = '1'; };
        }
        el.src = data[key];
      }
      else el.textContent = data[key];
    }
  });

  /* data-href 連結替換 */
  document.querySelectorAll('[data-href]').forEach(function(el) {
    var key = el.dataset.href;
    if (data[key] && data[key] !== '#') el.href = data[key];
  });

  /* 頁尾法人編號 */
  var reg = document.querySelector('.footer-reg');
  if (reg && data.org_reg_1) reg.textContent = data.org_reg_1 + (data.org_reg_2 ? ' ｜ ' + data.org_reg_2 : '');
}

/* ── 工具函式 ── */
function accentClass(item) {
  if (item.region === 'international') return 'accent-orange';
  return item.type === 'video' ? 'accent-teal' : 'accent-navy';
}
function formatDateDisplay(dateStr) {
  return (dateStr || '').replace('-', '.');
}
function formatDateFeatured(dateStr) {
  var parts = (dateStr || '').split('-');
  var y = parts[0], m = parts[1];
  return y && m ? y + ' 年 ' + parseInt(m) + ' 月' : dateStr;
}

/* ── 精選報導區 ── */
function buildFeatCard(item, isMain, delay) {
  var isVideo = item.type === 'video';
  var isIntl  = item.region === 'international';
  var badgeHtml = isIntl
    ? '<div class="media-badge badge-intl">🌍 國際</div>'
    : isVideo
      ? '<div class="media-badge badge-video">▶ 影片</div>'
      : '<div class="media-badge badge-text">📄 文字</div>';
  var videoHtml = isVideo && item.youtubeId
    ? '<div class="video-wrap"><iframe src="https://www.youtube.com/embed/' + item.youtubeId + '"'
      + ' title="' + item.outlet + ' 報導"'
      + ' allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"'
      + ' allowfullscreen></iframe></div>' : '';
  var desc = item.featured_desc || item.excerpt;
  var descHtml = desc ? '<div class="feat-desc">' + desc + '</div>' : '';
  var linkText = isVideo ? '觀看報導 ↗' : '閱讀全文 ↗';
  return ''
    + '<div class="feat-card ' + (isMain ? 'main-card' : '') + ' fade-in" style="transition-delay:' + delay + 's">'
    +   videoHtml
    +   '<div class="feat-body">'
    +     badgeHtml
    +     '<div class="feat-outlet">' + item.outlet + '</div>'
    +     '<div class="feat-title">' + item.title + '</div>'
    +     descHtml
    +     '<div class="feat-footer">'
    +       '<span class="feat-date">' + formatDateFeatured(item.date) + '</span>'
    +       '<a class="feat-link" href="' + item.link + '" target="_blank">' + linkText + '</a>'
    +     '</div>'
    +   '</div>'
    + '</div>';
}

/* ── 完整報導條列區 ── */
function buildReportRow(item) {
  var isVideo  = item.type === 'video';
  var pillHtml = isVideo
    ? '<span class="type-pill pill-video">▶ 影片</span>'
    : '<span class="type-pill pill-text">📄 文字</span>';
  var linkText = isVideo ? '觀看 ↗' : '閱讀 ↗';
  return ''
    + '<div class="report-row">'
    +   '<div class="row-accent ' + accentClass(item) + '"></div>'
    +   '<div class="row-date">' + formatDateDisplay(item.date) + '</div>'
    +   '<div class="row-outlet-wrap">'
    +     '<div class="row-outlet">' + item.outlet + '</div>'
    +     '<div class="row-country">' + item.country + '</div>'
    +   '</div>'
    +   '<div class="row-content">'
    +     '<div class="row-title">' + item.title + '</div>'
    +     '<div class="row-excerpt">' + item.excerpt + '</div>'
    +   '</div>'
    +   '<div class="row-right">'
    +     pillHtml
    +     '<a class="row-link" href="' + item.link + '" target="_blank">' + linkText + '</a>'
    +   '</div>'
    + '</div>';
}

function renderMedia(reports) {
  /* 精選報導 */
  var featured = reports
    .filter(function(r) { return r.featured === 'TRUE'; })
    .sort(function(a, b) { return Number(a.featured_order) - Number(b.featured_order); });
  var grid = document.getElementById('featured-grid');
  grid.innerHTML = featured.map(function(item, i) { return buildFeatCard(item, i === 0, i * 0.08); }).join('');

  /* 完整列表：新到舊排序，依年份分組 */
  var sorted = reports.slice().sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
  var byYear = {};
  sorted.forEach(function(item) {
    var year = (item.date || '').split('-')[0];
    if (year) { if (!byYear[year]) byYear[year] = []; byYear[year].push(item); }
  });
  var currentYear = String(new Date().getFullYear());
  var listEl = document.getElementById('reports-list');
  var yearKeys = Object.keys(byYear).sort(function(a, b) { return b - a; });

  listEl.innerHTML = yearKeys.map(function(year, yi) {
    var isOpen = (year === currentYear) || (yi === 0 && !byYear[currentYear]);
    var count = byYear[year].length;
    return ''
      + '<div class="year-group fade-in' + (isOpen ? ' open' : '') + '" style="transition-delay:' + (yi * 0.05) + 's">'
      +   '<div class="year-label">'
      +     '<span class="year-num">' + year + '</span>'
      +     '<span class="year-count">' + count + ' 篇</span>'
      +     '<span class="year-line"></span>'
      +     '<svg class="year-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>'
      +   '</div>'
      +   '<div class="year-content">'
      +     byYear[year].map(buildReportRow).join('')
      +   '</div>'
      + '</div>';
  }).join('');

  /* 年份開合 toggle */
  listEl.querySelectorAll('.year-label').forEach(function(label) {
    label.addEventListener('click', function() {
      label.parentElement.classList.toggle('open');
    });
  });

  /* 動畫觀察 */
  var io = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) { e.target.classList.add('show'); io.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade-in').forEach(function(el) { io.observe(el); });
}

/* ══════════════════════════════════════════
   CSV 載入（Promise.all 平行 + 快取）
══════════════════════════════════════════ */
Promise.all([
  fetchCSV('0', 'global'),              // 全站設定
  fetchCSV('1793841217', 'media'),       // 媒體報導
]).then(function(results) {
  applyFields(parseKV(parseCSV(results[0])));
  renderMedia(parseRows(parseCSV(results[1])));
}).catch(function(err) {
  console.error('[TXGCCA] CSV fetch 失敗:', err);
});
</script>

<script>
/* ── 漢堡選單開關 ── */
var hamburger = document.getElementById('nav-hamburger');
var drawer    = document.getElementById('nav-drawer');
var backdrop  = document.getElementById('nav-backdrop');

function openMenu() {
  var navBottom = document.querySelector('nav').getBoundingClientRect().bottom;
  drawer.style.top = navBottom + 'px';
  drawer.classList.add('open');
  backdrop.classList.add('open');
  hamburger.classList.add('open');
  hamburger.setAttribute('aria-label', '關閉選單');
  document.body.style.overflow = 'hidden';
}
function closeMenu() {
  drawer.classList.remove('open');
  backdrop.classList.remove('open');
  hamburger.classList.remove('open');
  hamburger.setAttribute('aria-label', '開啟選單');
  document.body.style.overflow = '';
}

hamburger.addEventListener('click', function() {
  drawer.classList.contains('open') ? closeMenu() : openMenu();
});
backdrop.addEventListener('click', closeMenu);
drawer.querySelectorAll('.nav-link').forEach(function(link) {
  link.addEventListener('click', closeMenu);
});
</script>
