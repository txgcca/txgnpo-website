  gap: 22px;
}

/* ── 卡片 ── */
.act-card { background: var(--white); border-radius: 6px; overflow: hidden; border: 1px solid var(--rule); box-shadow: 0 2px 8px rgba(0,55,100,.04); transition: transform .2s, box-shadow .2s; opacity: 0; transform: translateY(16px); }

.act-img-wrap { overflow: hidden; position: relative; background: var(--navy); }
.act-img-fallback { aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--navy) 0%, var(--navy-l) 100%); font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: .1em; color: rgba(255,255,255,.18); }
.act-body { padding: 18px 20px 20px; }
.act-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }

.act-desc  { font-size: 13px; color: var(--muted); line-height: 1.75; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-wrap: pretty; }

/* ═══════════════════════════════════════
   ② 編年記錄 — Accordion 區
═══════════════════════════════════════ */

.chron-divider { border: none; border-top: 1px solid var(--rule); margin-bottom: 48px; }

.year-hd {

  padding: 15px 20px; background: var(--white);
  cursor: pointer; user-select: none;
  transition: background .15s;
}
.year-hd:hover { background: var(--off-white); }
.year-block.open .year-hd { background: var(--navy); }

.year-badge {
  font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700;
  color: var(--navy); min-width: 52px;
  transition: color .2s;
}
.year-block.open .year-badge { color: var(--white); }

.year-count {
  font-size: 11px; color: var(--muted);
  background: rgba(0,55,100,.07); border-radius: 99px;
  padding: 2px 10px; transition: all .2s;
}
.year-block.open .year-count { background: rgba(255,255,255,.12); color: rgba(255,255,255,.55); }

.year-arrow {
  margin-left: auto; width: 18px; height: 18px;
  color: var(--muted); flex-shrink: 0;
  transition: transform .25s, color .2s;
}
.year-block.open .year-arrow { transform: rotate(180deg); color: rgba(255,255,255,.5); }

/* 展開內容 */
.year-content { display: none; background: var(--white); border-top: 1px solid var(--rule); }
.year-block.open .year-content { display: block; }

/* 記錄列 */
.chron-list { padding: 8px 0 0; }
.chron-row {
  display: grid;
  grid-template-columns: 100px auto 1fr;
  align-items: baseline;
  gap: 0 20px;
  padding: 12px 20px;
  border-bottom: 1px solid rgba(0,55,100,.05);
  transition: background .1s;
}
.chron-row:last-child { border-bottom: none; }
.chron-row:hover { background: var(--off-white); }
.chron-date-cell { font-size: 12px; color: var(--muted); white-space: nowrap; font-weight: 500; }
.chron-cat {

.chron-title-cell { font-size: 14px; color: var(--ink); line-height: 1.5; }

.chron-note { font-size: 12px; color: var(--muted); margin-top: 2px; }

<!-- ════ 版型 JS ════════════════════════════════════════════════ -->
<script>

const ROWS_PER_YEAR = 5;   /* 每年初始顯示列數上限 */

/* ── 標籤色對照 ── */
const BADGE_CLASS = { teal: 'b-teal', orange: 'b-orange', navy: 'b-navy' };
const CAT_CLASS = {
  '里程碑':   'b-navy',
  '演習':     'b-navy',
  '公益':     'b-navy',
  '課程活動': 'b-orange',
  '課程':     'b-orange',
  '推廣':     'b-orange',
  '訓練':     'b-orange',
  '外部合作': 'b-orange',
  '媒體':     'b-teal',
};

/* ═══════════════════════════════
   頁面文字填入
═══════════════════════════════ */
function renderPageInfo(p) {
  document.getElementById('pi-breadcrumb').textContent    = p.page_title;
  document.getElementById('pi-title').textContent         = p.page_title;
  document.getElementById('pi-subtitle').textContent      = p.page_subtitle;
  document.getElementById('pi-section-key').textContent   = p.section_key;
  document.getElementById('pi-section-chron').textContent = p.section_chron;
  document.getElementById('pi-back-text').textContent     = p.back_text;
  document.getElementById('pi-back-link').href            = p.back_url;
}

function renderSiteConfig(s) {
  /* Footer CTA 按鈕連結 */
  var btnP = document.getElementById('pi-cta-primary');
  if (btnP && s.url_cta_join) btnP.href = s.url_cta_join;
  var btnS = document.getElementById('pi-cta-secondary');
  if (btnS && s.url_cta_calendar) btnS.href = s.url_cta_calendar;
}

/* ═══════════════════════════════
   ① 渲染關鍵記事卡片
═══════════════════════════════ */
/* 關鍵記事配圖：
   - image_url 填檔名（例如 2024-registration.jpg）→ 讀 images/key-events/ 裡的檔案
   - 填完整網址（https://…）→ 照舊使用該網址
   - 空白、或檔案還沒上傳 → 顯示 TXGCCA 佔位圖 */
const KEY_EVENT_IMG_DIR = 'images/key-events/';
function keyEventImgSrc(v) {
  v = (v || '').trim();
  if (!v) return '';
  return /^https?:\/\//i.test(v) ? v : KEY_EVENT_IMG_DIR + v;
}

function renderKeyEvents(events) {
  const grid = document.getElementById('key-grid');
  grid.innerHTML = events.map((e, i) => `
    <div class="act-card" style="transition-delay:${(i % 3) * 0.07}s">
      <div class="act-img-wrap">
        ${keyEventImgSrc(e.image_url)
          ? `<img class="act-img" src="${keyEventImgSrc(e.image_url)}" alt="${e.title}" loading="lazy"
                onerror="this.outerHTML='<div class=&quot;act-img-fallback&quot;>TXGCCA</div>'">`
          : `<div class="act-img-fallback">TXGCCA</div>`}
      </div>
      <div class="act-body">
        <div class="act-meta">
          <span class="act-date">${e.date}</span>
          ${e.badge ? `<span class="act-badge ${BADGE_CLASS[e.badge_color] || 'b-navy'}">${e.badge}</span>` : ''}
        </div>
        <div class="act-title">${e.title}</div>
        <div class="act-desc">${e.description}</div>
      </div>
    </div>
  `).join('');

  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('show'); io.unobserve(en.target); } });
  }, { threshold: 0.1 });
  grid.querySelectorAll('.act-card').forEach(el => io.observe(el));
}

/* ═══════════════════════════════
   ② 渲染編年 Accordion
═══════════════════════════════ */
function groupByYear(records) {
  const map = {};
  records.forEach(r => {
    if (!map[r.year]) map[r.year] = [];
    map[r.year].push(r);
  });
  return map;
}

function renderChronRow(r) {
  return `
    <div class="chron-row">
      <div class="chron-date-cell">${r.date_display}</div>
      <span class="chron-cat ${CAT_CLASS[r.category] || 'b-navy'}">${r.category}</span>
      <div>
        <div class="chron-title-cell">${r.title}${r.partner ? `<span class="chron-partner">｜${r.partner}</span>` : ''}</div>
        ${r.note ? `<div class="chron-note">${r.note}</div>` : ''}
      </div>
    </div>
  `;
}

/* badge 等寬：量測前先暫時顯示所有收合區塊，避免 display:none 導致 offsetWidth=0 */
function equalizeChronBadges() {
  const allContent = document.querySelectorAll('#chron-accordion .year-content');

  /* 1. 暫時顯示（visibility:hidden 不閃爍） */
  allContent.forEach(el => {
    if (el.style.display === 'none' || el.style.display === '') {
      el.dataset.wasHidden = '1';
      el.style.display = 'block';
      el.style.visibility = 'hidden';
    }
  });

  /* 2. 量最大寬度並統一套用 */
  const badges = document.querySelectorAll('#chron-accordion .chron-cat');
  let maxW = 0;
  badges.forEach(b => { b.style.width = ''; maxW = Math.max(maxW, b.offsetWidth); });
  badges.forEach(b => { b.style.width = maxW + 'px'; });

  /* 3. 還原收合狀態 */
  allContent.forEach(el => {
    if (el.dataset.wasHidden) {
      el.style.display = '';
      el.style.visibility = '';
      delete el.dataset.wasHidden;
    }
  });
}

function renderAccordion(records) {
  const map   = groupByYear(records);
  const years = Object.keys(map).map(Number).sort((a, b) => b - a);  /* 新→舊 */
  const wrap  = document.getElementById('chron-accordion');

  /* 重置某個年份區塊的「展開更多」狀態，恢復只顯示前 N 筆 */
  function resetShowMore(block, yr) {
    var state = block._showMoreState;
    if (!state || !state.expanded) return;
    var list = block.querySelector('#list-' + yr);
    var allRows = list.querySelectorAll('.chron-row');
    for (var ri = allRows.length - 1; ri >= ROWS_PER_YEAR; ri--) {
      allRows[ri].remove();
    }
    state.btn.textContent = '＋ 查看其餘 ' + state.hiddenCount + ' 筆';
    state.expanded = false;
  }

  years.forEach((yr, idx) => {
    const rows    = map[yr];
    const total   = rows.length;
    const visible = rows.slice(0, ROWS_PER_YEAR);
    const hidden  = rows.slice(ROWS_PER_YEAR);
    const isOpen  = idx === 0;  /* 最新年份預設展開 */

    const block = document.createElement('div');
    block.className = 'year-block' + (isOpen ? ' open' : '');
    block.dataset.year = yr;
    block.innerHTML = `
      <div class="year-hd">
        <span class="year-badge">${yr}</span>
        <span class="year-count">${total} 筆</span>
        <svg class="year-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
      <div class="year-content">
        <div class="chron-list" id="list-${yr}">
          ${visible.map(renderChronRow).join('')}
        </div>
        ${hidden.length > 0 ? `
        <div class="show-more-wrap" id="more-wrap-${yr}">
          <button class="show-more-btn" data-year="${yr}">＋ 查看其餘 ${hidden.length} 筆</button>
        </div>` : ''}
      </div>
    `;

    /* 單一展開 accordion：點開一個年份時，其他全部收合＋重置 */
    block.querySelector('.year-hd').addEventListener('click', () => {
      const wasOpen = block.classList.contains('open');

      /* 收合所有其他年份並重置展開狀態 */
      wrap.querySelectorAll('.year-block').forEach(other => {
        if (other !== block && other.classList.contains('open')) {
          other.classList.remove('open');
          resetShowMore(other, other.dataset.year);
        }
      });

      /* 切換自己 */
      if (wasOpen) {
        block.classList.remove('open');
        resetShowMore(block, yr);
      } else {
        block.classList.add('open');
      }
    });

    /* 展開 / 收合 toggle（雙向） */
    const moreBtn = block.querySelector('.show-more-btn');
    if (moreBtn) {
      block._showMoreState = { btn: moreBtn, expanded: false, hiddenCount: hidden.length };

      moreBtn.addEventListener('click', () => {
        const state = block._showMoreState;
        const list = block.querySelector('#list-' + yr);
        if (!state.expanded) {
          /* 展開：附加隱藏列 */
          list.insertAdjacentHTML('beforeend', hidden.map(renderChronRow).join(''));
          moreBtn.textContent = '收起';
          state.expanded = true;
          requestAnimationFrame(equalizeChronBadges);
        } else {
          /* 收合：移除多出來的列 */
          var allRows = list.querySelectorAll('.chron-row');
          for (var ri = allRows.length - 1; ri >= ROWS_PER_YEAR; ri--) {
            allRows[ri].remove();
          }
          moreBtn.textContent = '＋ 查看其餘 ' + hidden.length + ' 筆';
          state.expanded = false;
        }
      });
    }

    wrap.appendChild(block);
  });
}

/* ── fade-in general ── */
const fadeIo = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('show'); fadeIo.unobserve(e.target); } });
}, { threshold: 0.1 });
document.querySelectorAll('.fade-in').forEach(el => fadeIo.observe(el));

/* ══════════════════════════════════════════
   CSV 基礎工具 + localStorage 快取
══════════════════════════════════════════ */
const CSV_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmLYivM4AX0l0D6Qv8i39uy_IQe4UkAgAm2wO5ACdo5dNxyH_TURO9LCipQRid3GfEKcI9OmAcZC0g/pub?gid=GID&single=true&output=csv';
function csvUrl(gid) { return CSV_BASE.replace('GID', gid); }

const CACHE_TTL = 6 * 60 * 60 * 1000; // 6 小時
const NO_CACHE = new URLSearchParams(window.location.search).has('nocache');

function getCacheKey(name) { return 'txgcca_cache_' + name; }

function cachedFetch(url, cacheName) {
  if (!NO_CACHE) {
    try {
      var raw = localStorage.getItem(getCacheKey(cacheName));
      if (raw) {
        var cached = JSON.parse(raw);
        var age = Date.now() - cached.timestamp;
        if (age < CACHE_TTL) {
          console.log('[TXGCCA] Cache HIT for "' + cacheName + '" (age: ' + Math.round(age / 60000) + ' min)');
          return Promise.resolve(cached.data);
        }
      }
    } catch (e) { /* 快取讀取失敗，繼續 fetch */ }
  }

  return fetch(url).then(function(r) { return r.text(); }).then(function(text) {
    try {
      localStorage.setItem(getCacheKey(cacheName), JSON.stringify({ timestamp: Date.now(), data: text }));
    } catch (e) { /* localStorage 寫入失敗（私密模式等），靜默忽略 */ }
    return text;
  });
}

/* 開發者模式 Console 訊息 */
(function() {
  if (NO_CACHE) {
    console.log('[TXGCCA] Cache mode: BYPASSED (?nocache=1 detected)');
  } else {
    var anyCache = false;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        if (localStorage.key(i).indexOf('txgcca_cache_') === 0) { anyCache = true; break; }
      }
    } catch(e) {}
    console.log('[TXGCCA] Cache mode: ' + (anyCache ? 'ENABLED' : 'INITIAL FETCH'));
  }
})();

function parseCSV(text) {
  var rows = [];
  var row = [], cur = '', inQ = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i], next = text[i+1];
    if (inQ) {
      if (ch === '"' && next === '"') { cur += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else { cur += ch; }
    } else {
      if (ch === '"') { inQ = true; }
      else if (ch === ',') { row.push(cur.trim()); cur = ''; }
      else if (ch === '\r' && next === '\n') { row.push(cur.trim()); cur = ''; rows.push(row); row = []; i++; }
      else if (ch === '\n') { row.push(cur.trim()); cur = ''; rows.push(row); row = []; }
      else { cur += ch; }
    }
  }
  if (cur || row.length) { row.push(cur.trim()); rows.push(row); }
  return rows.filter(function(r) { return r.some(function(c) { return c; }); });
}

function parseKV(rows) {
  var obj = {};
  rows.forEach(function(row) {
    if (row[0] && row[2] && row[0] !== '欄位名稱') obj[row[0]] = row[2];
  });
  return obj;
}

function parseRowsBy(rows, filterFn) {
  var headers = rows[0];
  return rows.slice(1)
    .map(function(row) {
      var obj = {};
      headers.forEach(function(h, i) { if (h) obj[h] = row[i] || ''; });
      return obj;
    })
    .filter(filterFn);
}

/* ── 啟動 ── */
renderPageInfo(PAGE_INFO);

Promise.all([
  cachedFetch(csvUrl('0'), 'site'),           // 全站設定
  cachedFetch(csvUrl('1523016997'), 'events'),      // 大事記
  cachedFetch(csvUrl('1168080937'), 'full_activities'),  // 完整活動紀錄
]).then(function(results) {
  var siteCSV = results[0];
  var keyCSV  = results[1];
  var chronCSV = results[2];

  // 全站設定
  var siteData = parseKV(parseCSV(siteCSV));

  // data-field 填入
  document.querySelectorAll('[data-field]').forEach(function(el) {
    var key = el.dataset.field;
    if (siteData[key]) {
      if (el.tagName === 'IMG') {
        el.src = siteData[key];
      }
      else { el.textContent = siteData[key]; }
    }
  });

  renderSiteConfig({
    url_cta_join:       siteData.url_cta_join        || '#',
    url_cta_calendar:   siteData.url_cta_calendar    || '#',
  });

  // data-href 社群連結
  document.querySelectorAll('[data-href]').forEach(function(el) {
    var val = siteData[el.dataset.href];
    if (val && val !== '#') el.href = val;
  });

  // Footer 立案號碼
  var reg = document.querySelector('.footer-reg');
  if (reg && siteData.org_reg_1) reg.textContent = siteData.org_reg_1 + (siteData.org_reg_2 ? ' ｜ ' + siteData.org_reg_2 : '');


  // 大事記（過往活動頁）
  var keyEvents = parseRowsBy(parseCSV(keyCSV), function(r) { return r.show_on_past === '是'; }).slice(0, 6);
  renderKeyEvents(keyEvents);

  // 完整活動紀錄
  var chronRecords = parseRowsBy(parseCSV(chronCSV), function(r) { return /^\d{4}$/.test(r.year); })
    .map(function(r) { return Object.assign({}, r, { year: parseInt(r.year), category: (r.category || '').trim(), partner: (r.partner || '').trim() }); })
    // 外部合作未填 partner = 不公開，整筆不顯示
    .filter(function(r) { return !(r.category === '外部合作' && !r.partner); })
    // 年份內由新到舊：月份 12 → 1；同月份 Sheet 越下面越前面
    .map(function(r, i) { return Object.assign(r, { _idx: i, _month: parseInt(r.date_display, 10) || 0 }); })
    .sort(function(a, b) { return (b.year - a.year) || (b._month - a._month) || (b._idx - a._idx); });
  renderAccordion(chronRecords);

  requestAnimationFrame(equalizeChronBadges);

}).catch(function(err) {
  console.error('CSV fetch 失敗:', err);
  renderSiteConfig({ url_cta_join:'#', url_cta_calendar:'#' });
  renderKeyEvents([]);
  renderAccordion([]);
});
</script>

<script>
/* 漢堡選單開關 */
var hamburger = document.getElementById('nav-hamburger');
var drawer    = document.getElementById('nav-drawer');
var backdrop  = document.getElementById('nav-backdrop');

function openMenu() {
  var navBottom = document.querySelector('nav').getBoundingClientRect().bottom;
  drawer.style.top = navBottom + 'px';
  drawer.classList.add('open');
  backdrop.classList.add('open');
  hamburger.classList.add('open');
  hamburger.setAttribute('aria-label', '關閉選單');
  document.body.style.overflow = 'hidden';
}
function closeMenu() {
  drawer.classList.remove('open');
  backdrop.classList.remove('open');
  hamburger.classList.remove('open');
  hamburger.setAttribute('aria-label', '開啟選單');
  document.body.style.overflow = '';
}

hamburger.addEventListener('click', function() {
  drawer.classList.contains('open') ? closeMenu() : openMenu();
});
backdrop.addEventListener('click', closeMenu);
drawer.querySelectorAll('.nav-link').forEach(function(link) {
  link.addEventListener('click', closeMenu);
});
</script>
